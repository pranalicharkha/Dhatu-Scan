services:
  - type: web
    name: dhatu-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand:  uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./dhatu.db
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
